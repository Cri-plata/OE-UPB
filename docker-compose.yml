services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oeupb}
      MYSQL_USER: ${MYSQL_USER:-oeupb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD}
    volumes: ["oeupb_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./OEUPB-Backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-oeupb}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-oeupb}
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY}
      APP_ENV: production
      INITIAL_CREDENTIAL_MODE: random
      TEMPORARY_CREDENTIAL_EXPIRE_HOURS: ${TEMPORARY_CREDENTIAL_EXPIRE_HOURS:-24}
      RECOVERY_CREDENTIAL_EXPIRE_MINUTES: ${RECOVERY_CREDENTIAL_EXPIRE_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?configure PUBLIC_ORIGIN}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./OEUPB-Frontend
  proxy:
    image: nginx:1.29-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on: [backend, frontend]
volumes:
  oeupb_mysql:
