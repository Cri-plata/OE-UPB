server { listen 80; server_name egresados.example.edu.co; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name egresados.example.edu.co;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # El backend acepta Excel de hasta 25 MB (ADR-017); el valor por defecto de nginx (1 MB) los rechazaría.
  client_max_body_size 26m;
  location /api/ {
    # La carga de 50.000 filas y el entrenamiento del modelo de análisis de empleabilidad pueden superar los 60 s por defecto.
    proxy_read_timeout 180s; proxy_send_timeout 180s;
    proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id;
  }
  location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
}
