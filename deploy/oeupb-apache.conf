# ==============================================================================
# CONFIGURACIÓN DE VIRTUALHOST APACHE HTTPD (RED HAT / RHEL)
# PROYECTO: Observatorio de Egresados UPB (OE-UPB)
# RUTA RECOMENDADA EN EL SERVIDOR: /etc/httpd/conf.d/oeupb.conf
# ==============================================================================

# 1. Redirección obligatoria HTTP -> HTTPS (Puerto 80)
<VirtualHost *:80>
    # Reemplazar con el FQDN institucional asignado por CTIC
    ServerName egresados.upb.edu.co
    ServerAlias oe.upb.edu.co

    # Redirección permanente a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST} [R=301,L]

    ErrorLog /var/log/httpd/oeupb_http_error.log
    CustomLog /var/log/httpd/oeupb_http_access.log combined
</VirtualHost>

# 2. Servidor Seguro HTTPS (Puerto 443)
<VirtualHost *:443>
    # Reemplazar con el FQDN institucional asignado por CTIC
    ServerName egresados.upb.edu.co
    ServerAlias oe.upb.edu.co

    # Configuración SSL / TLS institucional
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Rutas absolutas a los certificados provistos por CTIC:
    SSLCertificateFile /etc/pki/tls/certs/oeupb_fullchain.crt
    SSLCertificateKeyFile /etc/pki/tls/private/oeupb_private.key
    # Si CTIC proporciona certificado de cadena intermedia (CA Bundle):
    # SSLCACertificateFile /etc/pki/tls/certs/upb_intermediate.crt

    # Cabeceras de seguridad
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    # Límite de carga para encuestas masivas Excel (hasta 26 MB, ADR-017)
    LimitRequestBody 27262976

    # Preservar el host y enviar cabeceras hacia FastAPI y Angular
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Enrutamiento al Backend API (FastAPI en puerto interno 8000)
    # Timeouts ampliados a 180s para el entrenamiento del modelo y cargas masivas
    ProxyPass /api/ http://127.0.0.1:8000/api/ timeout=180
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Enrutamiento al Frontend (Angular SPA en puerto interno 8080)
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog /var/log/httpd/oeupb_ssl_error.log
    CustomLog /var/log/httpd/oeupb_ssl_access.log combined
</VirtualHost>
