# ==============================================================================
# CONFIGURACION APACHE 2 (VirtualHost) - OBSERVATORIO DE EGRESADOS UPB (OE-UPB)
# Ubicacion en Ubuntu: /etc/apache2/sites-available/oeupb.conf
# Habilitar modulos: sudo a2enmod ssl proxy proxy_http rewrite headers
# Habilitar sitio:   sudo a2ensite oeupb.conf && sudo systemctl reload apache2
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PUERTO 80 (HTTP) -> Redireccion forzosa a HTTPS con FQDN
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    # Reemplazar con el FQDN institucional asignado por CTIC (ej: oe.upb.edu.co)
    ServerName oe.upb.edu.co
    ServerAdmin soporte.egresados@upb.edu.co

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST} [R=301,L]

    ErrorLog /oeupb_error.log
    CustomLog /oeupb_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. PUERTO 443 (HTTPS) -> Servicio Principal con Certificados Institucionales
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    # FQDN Institucional registrado en el DNS de la red 10
    ServerName oe.upb.edu.co
    ServerAdmin soporte.egresados@upb.edu.co

    # Parametros SSL / TLS
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Rutas donde CTIC ubica los certificados institucionales (Ajustar segun rutas de CTIC)
    SSLCertificateFile /etc/ssl/certs/oe_upb_edu_co.crt
    SSLCertificateKeyFile /etc/ssl/private/oe_upb_edu_co.key
    # Si CTIC entrega cadena intermedia (CA Bundle), descomentar la siguiente linea:
    # SSLCertificateChainFile /etc/ssl/certs/oe_upb_edu_co.ca-bundle

    # Limite de subida de archivos (26 MB para soportar Excels de encuestas masivas - ADR-017)
    LimitRequestBody 27262976

    # Configuracion de Proxy Inverso
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy hacia el Backend FastAPI (puerto interno 8000)
    <Location /api>
        # Timeout extendido a 180s para el entrenamiento del modelo de IA y analisis de texto
        ProxyPass http://127.0.0.1:8000/api timeout=180
        ProxyPassReverse http://127.0.0.1:8000/api
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
    </Location>

    # Proxy hacia el Frontend Angular (puerto interno 8080 o contenedor frontend)
    <Location />
        ProxyPass http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
    </Location>

    ErrorLog /oeupb_ssl_error.log
    CustomLog /oeupb_ssl_access.log combined
</VirtualHost>
