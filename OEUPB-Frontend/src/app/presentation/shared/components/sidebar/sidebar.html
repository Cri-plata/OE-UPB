<aside class="sidebar">
  <div class="brand">
    <div class="logo">UPB</div>
    <h2>OEUPB</h2>
  </div>
  
  <nav class="nav-menu">
    <!-- Los reportes actuales son privados de la sede y exclusivos del coordinador. -->
    <ng-container *ngIf="userRole === 'Coordinador_Sede'">
      <a routerLink="/reporte" routerLinkActive="active" class="nav-item">Reporte general</a>
      <a routerLink="/tendencias" routerLinkActive="active" class="nav-item">Tendencias</a>
      <a routerLink="/explorador" routerLinkActive="active" class="nav-item">Explorador de Datos</a>
      <a routerLink="/analitica" routerLinkActive="active" class="nav-item">Analítica y alertas</a>
      <a routerLink="/directorio" routerLinkActive="active" class="nav-item">Directorio</a>
      <a routerLink="/habilidades" routerLinkActive="active" class="nav-item">Co-relaciones</a>
    </ng-container>

    <a *ngIf="userRole === 'Coordinador_Sede' || userRole === 'Usuario_Consulta'"
      routerLink="/publicaciones" routerLinkActive="active" class="nav-item">Gráficas publicadas</a>

    <!-- Solo visible para Coordinadores -->
    <ng-container *ngIf="userRole === 'Coordinador_Sede'">
      <a routerLink="/carga" routerLinkActive="active" class="nav-item">Cargar datos</a>
    </ng-container>

    <!-- Solo visible para Administradores CTIC -->
    <ng-container *ngIf="userRole === 'Admin_CTIC' || userRole === 'Coordinador_Sede'">
      <a routerLink="/admin-usuarios" routerLinkActive="active" class="nav-item">Administrar Usuarios</a>
    </ng-container>
    <!-- Perfil General -->
    <a routerLink="/mi-perfil" routerLinkActive="active" class="nav-item">Mi Perfil</a>
  </nav>

  <div class="bottom-menu">
    <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
  </div>
</aside>
