<div class="layout">
  <app-sidebar></app-sidebar>
  
  <main class="content">
    <header class="topbar">
      <h1>Gestión de Accesos y Usuarios</h1>
    </header>

    <div class="admin-grid">
      <!-- Formulario para crear coordinador -->
      <div class="card form-card">
        <h2>Crear Nuevo Usuario</h2>
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" formControlName="nombre" placeholder="Ej. Carlos Gómez">
          </div>
          
          <div class="form-group">
            <label>Correo Institucional</label>
            <input type="email" formControlName="correo" placeholder="ejemplo@upb.edu.co">
          </div>

          <div class="form-group">
            <label>Rol del Usuario *</label>
                        <select formControlName="rol">
              <option value="">Seleccione un rol...</option>
              <option value="Coordinador_Sede" *ngIf="usuarioActual?.rol === 'Admin_CTIC'">Coordinador de Sede</option>
              <option value="Directivo" *ngIf="usuarioActual?.rol === 'Coordinador_Sede'">Directivo</option>
              <option value="Profesor" *ngIf="usuarioActual?.rol === 'Coordinador_Sede'">Profesor</option>
            </select>
          </div>

          <div class="form-group" *ngIf="usuarioActual?.rol === 'Admin_CTIC'">
            <label>Sede Asignada * (Dejar vacío si es Nacional)</label>
                        <select formControlName="sede">
              <option value="">Seleccione una sede...</option>
              <option *ngFor="let s of sedesDisponibles" [value]="s">{{ s }}</option>
            </select>
          </div>

          <button type="submit" class="btn-primary" [disabled]="userForm.invalid">Crear Usuario</button>
        </form>
      </div>

      <!-- Lista de Usuarios -->
      <div class="card list-card">
        <h2>Usuarios Activos</h2>
        <table class="users-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Sede</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of usuarios">
              <td>{{ u.nombre }}</td>
              <td>{{ u.correo }}</td>
              <td><span class="badge">{{ u.rol }}</span></td>
              <td>{{ u.sede_id || 'N/A' }}</td>
              <td><button class="btn-danger" (click)="eliminarUsuario(u.id)">Eliminar</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
