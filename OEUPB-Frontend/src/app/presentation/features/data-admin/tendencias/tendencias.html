<div class="layout">
  <app-sidebar></app-sidebar>
  
  <main class="content">
    <div class="top-banner">
      <div class="banner-text">
        <h1>Análisis de Tendencias</h1>
        <p>Evolución de los indicadores de egresados a través del tiempo.</p>
      </div>
      <div class="upb-logo">
        <img src="/escudo-upb.png" alt="Escudo UPB" class="escudo-img">
      </div>
    </div>

    <div class="dashboard-container">
      <div class="chart-card full-width">
        <h2>Evolución de Tasa de Empleabilidad (Momento 0, 1, y 5)</h2>
        <div class="chart-wrapper line-chart" *ngIf="isChartReady">
          <canvas baseChart
            [data]="lineChartData"
            [type]="'line'"
            [options]="lineChartOptions">
          </canvas>
        </div>
      </div>
    </div>
  </main>
</div>
