<div class="layout">
  <app-sidebar></app-sidebar>
  
  <main class="content">
    <div class="top-banner">
      <div class="banner-text">
        <h1>Análisis de Tendencias (Histórico)</h1>
        <p>Evolución de los indicadores de egresados a través de los momentos (0, 1 y 5 años).</p>
      </div>
      <div class="upb-logo">
        <img src="/escudo-upb.png" alt="Escudo UPB" class="escudo-img">
      </div>
    </div>

    <div class="dashboard-container">
      
      <!-- Panel de Control -->
      <div class="control-panel">
        <div class="control-group">
          <label>Indicador a Analizar:</label>
          <select class="custom-select" (change)="changeIndicator($event)">
            <option value="empleabilidad">Tasa de Empleabilidad</option>
            <option value="salario">Promedio Salarial (SMLV)</option>
            <option value="satisfaccion">Nivel de Satisfacción General</option>
          </select>
        </div>
        <div class="control-group">
          <label>Tipo de Gráfico:</label>
          <select class="custom-select" (change)="changeChartType($event)">
            <option value="line">Líneas Suavizadas</option>
            <option value="bar">Barras Comparativas</option>
          </select>
        </div>
      </div>

      <div class="chart-card">
        <button (click)="exportarGrafica()">Exportar PNG</button>
        <div class="publication-header">
          <h2>Evolución Histórica: {{ currentIndicatorName }}</h2>
          <button *ngIf="!publicaciones[graficaKey]" class="publish-btn" [disabled]="publicando || !isChartReady" (click)="publicar()">Publicar</button>
          <button *ngIf="publicaciones[graficaKey]" class="withdraw-btn" [disabled]="publicando" (click)="retirar()">Retirar publicación</button>
        </div>
        <div id="grafica-tendencias" class="chart-wrapper line-chart" *ngIf="isChartReady">
          <canvas baseChart
            [data]="lineChartData"
            [type]="chartType"
            [options]="lineChartOptions">
          </canvas>
        </div>
        <div class="loading-state" *ngIf="!isChartReady">
          Calculando tendencias históricas en la base de datos...
        </div>
      </div>
    </div>
  </main>
</div>
