server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.csr.html;
  location / { try_files $uri $uri/ /index.csr.html; }
  # El índice referencia bundles con hash: debe revalidarse en cada carga para que un
  # redespliegue no deje a los navegadores con la versión anterior.
  location = /index.csr.html { add_header Cache-Control "no-cache"; }
}
